# iSCSI initiator state directories may be created by RPM installation,
# but /var is mutable and the image's /var tree is not authoritative at boot.
# Recreate the directories bootc lint identified on first boot.
# Keep this limited to confirmed paths rather than synthesizing tmpfiles rules
# for every directory installed by unrelated services.
d /var/lib/iscsi 0755 root root -
d /var/lib/iscsi/ifaces 0755 root root -
d /var/lib/iscsi/isns 0755 root root -
d /var/lib/iscsi/nodes 0755 root root -
d /var/lib/iscsi/send_targets 0755 root root -
