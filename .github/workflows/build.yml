---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true


jobs:
  kernel_preflight:
    name: Check Kinoite kernel compatibility
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Read kernel from remote Kinoite image
        id: kernel
        shell: bash
        run: |
          set -euo pipefail

          kernel="$(skopeo inspect --config \
            docker://quay.io/fedora/fedora-kinoite:45 |
            jq -er '.config.Labels["ostree.linux"]')"

          echo "Kinoite kernel: ${kernel}"
          echo "version=${kernel}" >> "$GITHUB_OUTPUT"

      - name: Verify matching Fedora development packages
        shell: bash
        env:
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        run: |
          set -euo pipefail

          podman run --rm \
            -e KERNEL_VERSION \
            registry.fedoraproject.org/fedora:45 \
            bash -euo pipefail -c '
              format="%{name}-%{version}-%{release}.%{arch}\n"

              for pkg in kernel-devel kernel-devel-matched; do
                expected="${pkg}-${KERNEL_VERSION}"

                echo "Checking ${expected}"

                available="$(dnf5 repoquery --available \
                  --queryformat "${format}" "${pkg}")"

                if ! grep -Fxq "${expected}" <<< "${available}"; then
                  echo "::error title=Kernel mismatch::Missing ${expected}"
                  exit 1
                fi

                echo "MATCH: ${expected}"
              done
            '


      - name: Check RPM Fusion NVIDIA package availability
        shell: bash
        run: |
          set -euo pipefail

          # Check availability before the expensive NVIDIA compilation starts.
          # Use a disposable Fedora 45 container so these repository checks
          # cannot modify the GitHub runner or the final Atomic Hat image.
          podman run --rm registry.fedoraproject.org/fedora:45 \
            bash -euo pipefail -c '
              # Stock Fedora does not enable RPM Fusion. Use the same
              # repository-release packages as build_files/build.sh.
              dnf5 install -y \
                https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-45.noarch.rpm \
                https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-45.noarch.rpm

              # A successful repoquery alone does not prove a package exists:
              # it can exit successfully with zero matching packages.
              for pkg in akmod-nvidia xorg-x11-drv-nvidia; do
                echo "Checking RPM Fusion package: ${pkg}"
                available="$(dnf5 repoquery --available \
                  --queryformat "%{name}" "${pkg}")"

                if ! grep -Fxq "${pkg}" <<< "${available}"; then
                  echo "::error title=RPM Fusion package unavailable::Missing ${pkg}"
                  exit 1
                fi

                echo "AVAILABLE: ${pkg}"
              done

              # Both packages must offer at least one identical version-release.
              # Checking names alone would miss a temporarily out-of-sync mirror.
              # Compare the full RPM version-release (not just the driver number)
              # while keeping the existing package-presence checks above.
              akmod_versions="$(dnf5 repoquery --available \
                --queryformat "%{version}-%{release}" akmod-nvidia | sort -u)"
              driver_versions="$(dnf5 repoquery --available \
                --queryformat "%{version}-%{release}" xorg-x11-drv-nvidia | sort -u)"

              # comm outputs the intersection of two sorted lists.
              matching_versions="$(comm -12 \
                <(printf "%s\\n" "${akmod_versions}") \
                <(printf "%s\\n" "${driver_versions}"))"

              if [[ -z "${matching_versions}" ]]; then
                echo "::error title=NVIDIA version mismatch::akmod-nvidia and xorg-x11-drv-nvidia have no matching version-release"
                echo "akmod-nvidia: ${akmod_versions}"
                echo "xorg-x11-drv-nvidia: ${driver_versions}"
                exit 1
              fi

              echo "MATCHING NVIDIA VERSION(S): ${matching_versions}"

              # Ask DNF to resolve the same NVIDIA package set as build.sh,
              # without downloading or installing the driver. --assumeno shows
              # the transaction, then intentionally declines it.
              #
              # IMPORTANT: DNF may return status 1 for this expected refusal.
              # Accept only a displayed transaction summary plus the explicit
              # cancellation message; real solver errors must fail preflight.
              if transaction="$(LC_ALL=C dnf5 --assumeno \
                --setopt=install_weak_deps=False install \
                akmod-nvidia \
                xorg-x11-drv-nvidia \
                xorg-x11-drv-nvidia-cuda \
                xorg-x11-drv-nvidia-power 2>&1)"; then
                status=0
              else
                status=$?
              fi

              echo "${transaction}"
              if [[ ${status} -eq 1 ]] &&
                 grep -Fq "Transaction Summary:" <<< "${transaction}" &&
                 grep -Eq "^Operation aborted( by the user)?\\.$" <<< "${transaction}"; then
                echo "PASS: DNF resolved the NVIDIA dependencies (installation declined)"
              else
                echo "::error title=NVIDIA dependency resolution::Unexpected DNF result (exit ${status})"
                exit 1
              fi
            '

  build_push:
    name: Build and push image
    needs: kernel_preflight
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # PRs and builds from non-default branches never receive the release key.
      - name: Prepare test module signing key
        if: github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          signing_dir="${RUNNER_TEMP}/atomic-hat-signing"
          mkdir -p "${signing_dir}"
          openssl req -new -x509 -newkey rsa:2048 -sha256 -days 2 -noenc \
            -subj '/CN=Atomic Hat CI test only/' \
            -addext 'basicConstraints=critical,CA:FALSE' \
            -addext 'keyUsage=critical,digitalSignature' \
            -addext 'extendedKeyUsage=codeSigning,1.3.6.1.4.1.2312.16.1.2' \
            -keyout "${signing_dir}/module.key" \
            -outform DER -out "${signing_dir}/module.der"
          echo "MODULE_SIGNING_KEY_FILE=${signing_dir}/module.key" >> "${GITHUB_ENV}"
          echo "MODULE_SIGNING_CERT_FILE=${signing_dir}/module.der" >> "${GITHUB_ENV}"

      - name: Prepare release module signing key
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${MODULE_SIGNING_KEY}" ]]; then
            echo '::error::Set the MODULE_SIGNING_KEY repository secret before publishing.'
            exit 1
          fi
          signing_dir="${RUNNER_TEMP}/atomic-hat-signing"
          mkdir -p "${signing_dir}"
          printf '%s\n' "${MODULE_SIGNING_KEY}" > "${signing_dir}/module.key"
          echo "MODULE_SIGNING_KEY_FILE=${signing_dir}/module.key" >> "${GITHUB_ENV}"
          echo "MODULE_SIGNING_CERT_FILE=${GITHUB_WORKSPACE}/atomic-hat.der" >> "${GITHUB_ENV}"

      # Give compilation/signing their own Actions log. The subsequent
      # build reuses this stage's layers in the same Podman storage.
      - name: Build signed NVIDIA kernel modules
        shell: bash
        run: |
          set -euo pipefail
          podman build --layers=true --pull=newer --target nvidia-builder \
            --secret "id=module_signing_key,src=${MODULE_SIGNING_KEY_FILE}" \
            --secret "id=module_signing_cert,src=${MODULE_SIGNING_CERT_FILE}" \
            --file Containerfile \
            --tag "${IMAGE_NAME}:nvidia-builder-ci" .

      - name: Build final Atomic Hat desktop image
        id: build-image
        shell: bash
        run: |
          set -euo pipefail
          just build \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      # Read-only audit of package-owned and unowned /var/lib directories.
      # Use this output to decide which remaining bootc lint warnings need
      # tmpfiles.d rules versus narrowly targeted cleanup.
      - name: Audit final runtime /var/lib directories
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}/build_files/audit-var.sh:/run/atomic-hat-audit-var.sh:ro" \
            "${IMAGE_NAME}:${DEFAULT_TAG}" /run/atomic-hat-audit-var.sh

      # Existing Containerfile lint may print warnings without failing. Reject
      # unresolved warnings in the assembled final image before rechunking.
      - name: Require warning-free final bootc lint
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${DEFAULT_TAG}"
          lint_output="$(podman run --rm --entrypoint bootc "$image" container lint 2>&1)"
          printf '%s\n' "$lint_output"
          if grep -Eq '^Lint warning:|^Warnings: [1-9][0-9]*' <<< "$lint_output"; then
            echo '::error title=bootc lint::Final runtime has unresolved lint warnings'
            exit 1
          fi
          echo 'PASS: final runtime has no bootc lint warnings'

      # Validate the actual final image, never just the NVIDIA builder.
      - name: Verify final NVIDIA modules and applications
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}/build_files/validate-final.sh:/run/atomic-hat-validate.sh:ro" \
            "${IMAGE_NAME}:${DEFAULT_TAG}" /run/atomic-hat-validate.sh

      # Snapshot every installed RPM (with version) before rechunking.
      - name: Record final RPM inventory before rechunk
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm --entrypoint rpm "${IMAGE_NAME}:${DEFAULT_TAG}" \
            -qa --qf '%{NAME}.%{ARCH} %{EPOCHNUM}:%{VERSION}-%{RELEASE}\n' \
            | sort > "${RUNNER_TEMP}/atomic-hat-rpms-before.txt"
          echo "Recorded $(wc -l < "${RUNNER_TEMP}/atomic-hat-rpms-before.txt") RPMs"

      - name: Record OCI metadata before rechunk
        id: oci-metadata
        shell: bash
        run: |
          set -euo pipefail
          info="$(podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}")"
          version="$(jq -er '.[0].Labels["org.opencontainers.image.version"]' <<< "${info}")"
          revision="$(jq -er '.[0].Labels["org.opencontainers.image.revision"]' <<< "${info}")"
          test "${revision}" = "${GITHUB_SHA}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Image version: ${version}"
          echo "Git revision: ${revision}"

      # Build Image now builds final -> runtime-test, including all applications.
      # Do not build runtime-test a second time; that duplicated installation.

      - name: Remove module signing files
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/atomic-hat-signing"

      # Trial: compare Chunkah performance and bootc image validity against
      # the existing rpm-ostree rechunker without publishing PR builds.
      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Validate rechunked bootc image
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${DEFAULT_TAG}"
          test "$(podman image inspect "$image" --format '{{ index .Config.Labels "containers.bootc" }}')" = 1
          lint_output="$(podman run --rm --entrypoint bootc "$image" container lint 2>&1)"
          printf '%s\n' "$lint_output"
          if grep -Eq '^Lint warning:|^Warnings: [1-9][0-9]*' <<< "$lint_output"; then
            echo '::error title=bootc lint::Rechunked image has unresolved lint warnings'
            exit 1
          fi
          echo 'PASS: rechunked runtime has no bootc lint warnings'

      - name: Verify rechunked NVIDIA modules and applications
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}/build_files/validate-final.sh:/run/atomic-hat-validate.sh:ro" \
            "${IMAGE_NAME}:${DEFAULT_TAG}" /run/atomic-hat-validate.sh

      - name: Compare RPM inventory after rechunk
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm --entrypoint rpm "${IMAGE_NAME}:${DEFAULT_TAG}" \
            -qa --qf '%{NAME}.%{ARCH} %{EPOCHNUM}:%{VERSION}-%{RELEASE}\n' \
            | sort > "${RUNNER_TEMP}/atomic-hat-rpms-after.txt"
          diff -u \
            "${RUNNER_TEMP}/atomic-hat-rpms-before.txt" \
            "${RUNNER_TEMP}/atomic-hat-rpms-after.txt"
          echo "PASS: all installed RPMs and versions survived rechunking"

      - name: Diagnose OCI metadata after rechunk
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.oci-metadata.outputs.version }}
        run: |
          set -euo pipefail
          podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -S '
            .[0].Labels | with_entries(select(
              .key | startswith("org.opencontainers.image.") or . == "containers.bootc"
            ))
          '
          podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -er \
            --arg version "${EXPECTED_VERSION}" \
            --arg revision "${GITHUB_SHA}" '
              .[0].Labels as $labels |
              [
                {name: "version", pass: ($labels["org.opencontainers.image.version"] == $version)},
                {name: "revision", pass: ($labels["org.opencontainers.image.revision"] == $revision)},
                {name: "title", pass: (($labels["org.opencontainers.image.title"] // "") | length > 0)},
                {name: "created", pass: (($labels["org.opencontainers.image.created"] // "") | length > 0)},
                {name: "containers.bootc", pass: (($labels["containers.bootc"] // "") | length > 0)}
              ] as $checks |
              ($checks | map("\(.name): \(if .pass then "PASS" else "FAIL" end)") | .[]),
              ($checks | all(.pass))
            '
      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

